<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacks · sales content library</title>
<link rel="stylesheet" href="../shared.css">
<style>
:root{--bg:#f6f6fb;--card:#fff;--side:#fafafe;--ink:#1d1b33;--mute:#6b6987;--line:#e4e3ef;--hl:#ecebfb;--accent:#5b4bdb;
  --link:#4a3bc8;--bar:#211a4d;--barink:#fff;--chip:#ecebfb;--chipink:#3b2fa8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(60,40,180,.08)}
.thumb{aspect-ratio:16/10;background:#eceaf6 center/cover no-repeat;display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#8b86b5;font-size:22px;border-bottom:1px solid var(--line)}
.card .b{padding:10px 12px;flex:1}
.card .t{font-weight:600;font-size:13.5px;line-height:1.3;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12px;color:var(--mute)}
.ext{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;background:#888;margin-right:6px}
.ext.pdf{background:#d1453b}.ext.pptx{background:#d0632c}.ext.xlsx{background:#1f7a46}.ext.docx{background:#2b5fb4}.ext.html{background:#6a5acd}.ext.md{background:#444}
.vers li{margin:4px 0}
.views{font-size:12px;color:var(--mute)}
</style></head>
<body>
<div class="fixture">Test dataset for the SC Open Corpus. Libraries are built from public material and contain deliberate faults for testing. Nothing here is an official statement by the companies named. <a href="../">About</a></div>
<div class="top"><span class="logo"><i></i>Stacks</span>
  <input id="q" placeholder="Search content, tags, owners">
  <span class="sp"></span>
  <select id="org" title="Library"></select>
  <a class="btn" id="export" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.35)">Export library</a>
</div>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main class="main"><h1 id="h"></h1><div class="muted" id="sub"></div>
    <div class="bar2" id="filters"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<div class="drawer" id="drawer" hidden></div>
<script src="../app.js"></script>
<script>
let D = null, folder = '', filt = {kind: '', show: 'all'};
const $ = s => document.querySelector(s);
async function load(org) {
  D = await getJSON(`../data/${org}/stacks.json`);
  $('#export').hidden = !D.export; if (D.export) { $('#export').href = `../data/${org}/${D.export}`; $('#export').setAttribute('download', '') }
  folder = ''; render();
}
function items() {
  const q = $('#q').value.toLowerCase();
  return D.items.filter(i => (!folder || i.folder === folder || i.folder.startsWith(folder + '/')) &&
    (!filt.kind || i.kind === filt.kind) &&
    (filt.show === 'all' || (filt.show === 'expired' && i.expired) || (filt.show === 'external' && i.approved_external && !i.expired) || (filt.show === 'noai' && i.not_for_ai)) &&
    (!q || (i.title + ' ' + i.tags.join(' ') + ' ' + i.owner + ' ' + i.filename + ' ' + JSON.stringify(i.props || {})).toLowerCase().includes(q)));
}
function render() {
  const counts = {}; D.items.forEach(i => i.folder.split('/').reduce((a, p) => { a = a ? a + '/' + p : p; counts[a] = (counts[a] || 0) + 1; return a }, ''));
  const folders = Object.keys(counts).sort();
  $('#side').innerHTML = `<h4>${esc(D.name)}</h4><a href="#" data-f="" class="${folder ? '' : 'on'}">All content <small>${D.items.length}</small></a>` +
    folders.map(f => `<a href="#" data-f="${esc(f)}" class="${f === folder ? 'on' : ''}" style="padding-left:${10 + 12 * (f.split('/').length - 1)}px">${esc(f.split('/').pop())} <small>${counts[f]}</small></a>`).join('');
  document.querySelectorAll('#side a').forEach(a => a.onclick = e => { e.preventDefault(); folder = a.dataset.f; render() });
  const list = items();
  $('#h').textContent = folder ? folder.split('/').pop() : 'All content';
  $('#sub').textContent = `${list.length} items · library updated ${D.updated}`;
  const kinds = [...new Set(D.items.map(i => i.kind))].sort();
  $('#filters').innerHTML = `<select id="fk"><option value="">All types</option>${kinds.map(k => `<option ${k === filt.kind ? 'selected' : ''}>${k}</option>`).join('')}</select>
    <select id="fs"><option value="all">All statuses</option><option value="external" ${filt.show === 'external' ? 'selected' : ''}>Approved for customers</option><option value="expired" ${filt.show === 'expired' ? 'selected' : ''}>Expired</option><option value="noai" ${filt.show === 'noai' ? 'selected' : ''}>Not for AI</option></select>`;
  $('#fk').onchange = e => { filt.kind = e.target.value; render() }; $('#fs').onchange = e => { filt.show = e.target.value; render() };
  $('#grid').innerHTML = list.map(i => `<div class="card" data-id="${i.id}">
     <div class="thumb" style="${i.thumb ? `background-image:url(../data/${D.org}/${i.thumb})` : ''}">${i.thumb ? '' : i.kind.toUpperCase()}</div>
     <div class="b"><div class="t">${esc(i.title)}</div>
     <div class="m"><span class="ext ${i.kind}">${i.kind.toUpperCase()}</span>${esc(i.owner)} · ${i.updated}</div>
     <div style="margin-top:6px">${i.expired ? '<span class="pill bad">Expired</span>' : ''}${i.internal_only ? '<span class="pill warn">Internal only</span>' : ''}${i.not_for_ai ? '<span class="pill warn">Not for AI</span>' : ''}${!i.approved_external && !i.internal_only ? '<span class="pill mute">Employee only</span>' : ''}<span class="pill mute">v${esc(i.version)}</span></div></div></div>`).join('') || '<p class="muted">Nothing here.</p>';
  document.querySelectorAll('.card').forEach(c => c.onclick = () => open_(c.dataset.id));
}
function open_(id) {
  const i = D.items.find(x => x.id === id), d = $('#drawer');
  d.hidden = false;
  d.innerHTML = `<button class="btn x" onclick="this.parentNode.hidden=true">Close</button><h2 style="margin:0 0 6px;font-size:18px">${esc(i.title)}</h2>
   <div>${i.tags.map(t => `<span class="pill">${esc(t)}</span>`).join('')}</div>
   ${i.description ? `<p>${esc(i.description)}</p>` : ''}
   <div class="kv"><b>File</b><span>${esc(i.filename)} (${fmtBytes(i.bytes)})</span><b>Folder</b><span>${esc(i.folder)}</span><b>Owner</b><span>${esc(i.owner)}</span>
   <b>Updated</b><span>${i.updated}</span><b>Expires</b><span>${i.expires || 'No expiry'}${i.expired ? ' <span class="pill bad">Expired</span>' : ''}</span>
   <b>Sharing</b><span>${i.internal_only ? 'Internal only. Do not share with customers.' : i.approved_external ? 'Approved for customers' : 'Not yet approved for customers'}</span>
   <b>Version</b><span>${esc(i.version)} · created ${i.created}</span><b>Views (90 days)</b><span>${i.views}</span>
   ${Object.entries(i.props || {}).filter(([k, v]) => v && v.length).map(([k, v]) => `<b>${esc(k)}</b><span>${v.map(esc).join(', ')}</span>`).join('')}
   ${i.legacy ? Object.entries(i.legacy).map(([k, v]) => `<b>${esc(k)}</b><span class="muted">${esc(v)}</span>`).join('') : ''}${i.origin ? `<b>Original</b><span><a href="${esc(i.origin)}" target="_blank" rel="noopener">${esc(host(i.origin))} ↗</a></span>` : ''}</div>
   <div class="bar2">${i.file ? `<a class="btn primary" href="../data/${D.org}/${i.file}" download="${esc(i.filename)}">Download</a>` : `<span class="muted">This copy isn't hosted here. Use the original link.</span>`}</div>
   ${i.versions.length > 1 ? `<h4>Versions</h4><ul class="vers">${i.versions.map(v => `<li><b>v${v.v}</b> · ${v.date} · ${esc(v.note || '')} ${v.file ? `<a href="../data/${D.org}/${v.file}" download="${esc(v.filename)}">${esc(v.filename)}</a>` : esc(v.filename)}</li>`).join('')}</ul>` : ''}`;
}
$('#q').oninput = () => render();
initOrgs('stacks', load);
</script></body></html>
